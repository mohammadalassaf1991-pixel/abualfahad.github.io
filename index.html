<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F-RIDE SUPREME GATE</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #ffab00;
            --text-color: #c9d1d9;
            --border-color: #30363d;
            --input-bg: #0d1117;
            --error-color: #f85149;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-logo {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent-color);
        }

        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(255, 171, 0, 0.3);
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title {
            color: var(--accent-color);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 20px;
        }

        .error-message {
            display: none;
            background-color: rgba(248, 81, 73, 0.1);
            color: var(--error-color);
            border: 1px solid var(--error-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #e69a00;
        }
    </style>
</head>
<body>

    <div class="header-logo">
        <img src="1000337548.jpg" alt="Logo">
    </div>

    <div class="login-card">
        <div class="brand-logo">
            <img src="1000337548.jpg" alt="F-RIDE Logo">
        </div>
        
        <h1 class="title">F-RIDE SUPREME GATE</h1>
        <p class="subtitle">منطقة سيادية محصنة - بوابة الإدارة العامة</p>

        <div id="errorBox" class="error-message">اسم المستخدم أو كلمة السر غير صحيحة، يرجى المحاولة مرة أخرى.</div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="masterId">اسم المستخدم</label>
                <input type="text" id="masterId" class="form-control" placeholder="أدخل اسم المستخدم..." required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="securityKey">مفتاح الحماية المشفر</label>
                <input type="password" id="securityKey" class="form-control" placeholder="أدخل كلمة السر..." required autocomplete="off">
            </div>

            <button type="submit" class="btn-submit">فتح النظام الحصري</button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const masterIdInput = document.getElementById('masterId').value.trim();
            const securityKeyInput = document.getElementById('securityKey').value.trim();
            const errorBox = document.getElementById('errorBox');

            // التحقق من بيانات الدخول المطلوبة
            if (masterIdInput === "mohammad139" && securityKeyInput === "0796129002***") {
                errorBox.style.display = "none";
                alert("تم التحقق بنجاح! جاري الدخول إلى لوحة التحكم...");
            } else {
                errorBox.style.display = "block";
            }
        }
    </script>

</body>
</html>
