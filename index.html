<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F-RIDE SUPREME CONTROL</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; min-height: 100vh; }
        
        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; text-align: center; }
        .brand-logo { width: 80px; height: 80px; margin: 0 auto 15px; border-radius: 50%; overflow: hidden; border: 2px solid #ffab00; }
        .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
        .title { color: #ffab00; font-size: 1.3rem; margin-bottom: 5px; }
        .subtitle { font-size: 0.85rem; color: #8b949e; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 12px; background-color: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 1rem; }
        .btn-submit { width: 100%; padding: 12px; background-color: #ffab00; color: #000; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .error-msg { display: none; color: #f85149; margin-bottom: 15px; font-size: 0.85rem; }

        /* لوحة التحكم */
        .dashboard { display: none; padding: 20px; }
        .dash-header { background-color: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .stat-box { background-color: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 8px; text-align: right; }
        .stat-box h3 { font-size: 0.85rem; color: #8b949e; margin-bottom: 10px; }
        .stat-box .num { font-size: 1.8rem; color: #ffab00; font-weight: bold; }
    </style>
</head>
<body>

    <!-- صفحة الدخول -->
    <div id="loginPage" class="login-wrapper">
        <div class="login-card">
            <div class="brand-logo"><img src="1000337548.jpg" alt="Logo"></div>
            <h1 class="title">F-RIDE SUPREME GATE</h1>
            <p class="subtitle">بوابة الإدارة العامة - أبو الفهد العدوان</p>
            
            <div id="errorBox" class="error-msg">البيانات غير صحيحة، تأكد من اسم المستخدم وكلمة السر!</div>

            <form onsubmit="checkLogin(event)">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="userInput" class="form-control" value="mohammad139" required>
                </div>
                <div class="form-group">
                    <label>كلمة السر</label>

                    <input type="text" id="passInput" class="form-control" value="0796129002***" required>
                </div>
                <button type="submit" class="btn-submit">فتح النظام الحصري</button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashPage" class="dashboard">
        <div class="dash-header">
            <h2 style="color: #ffab00;">لوحة التحكم العليا - F-RIDE MASTER</h2>
            <button onclick="location.reload()" style="background: red; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">خروج</button>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <h3>الكباتن النشطين</h3>
                <div class="num">35</div>
            </div>
            <div class="stat-box">
                <h3>الرحلات القائمة</h3>
                <div class="num">14</div>
            </div>
            <div class="stat-box">
                <h3>أرباح اليوم</h3>
                <div class="num">420 JOD</div>
            </div>
        </div>
    </div>

    <script>
        function checkLogin(e) {
            e.preventDefault();
            var u = document.getElementById('userInput').value.trim();
            var p = document.getElementById('passInput').value.trim();

            if (u === "mohammad139" && p === "0796129002***") {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('dashPage').style.display = 'block';
            } else {
                document.getElementById('errorBox').style.display = 'block';
            }
        }
    </script>

</body>
</html>
